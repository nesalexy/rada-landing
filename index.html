<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rada</title>
  <meta name="description" content="Законопроєкти Верховної Ради та голосування.">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a1a1e;
      --card: rgba(221, 238, 248, 0.95);
      --blue: #4a89d4;
      --muted: rgba(26, 26, 30, 0.62);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #fff;
    }

    .bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg span {
      position: absolute;
      width: 70vmax;
      height: 70vmax;
      border-radius: 50%;
      filter: blur(8px);
      opacity: 0.7;
    }

    .bg .a {
      right: -18vmax;
      top: -22vmax;
      background: radial-gradient(circle, rgba(51, 153, 255, 0.68) 0%, rgba(51, 153, 255, 0) 68%);
      animation: drift 21s ease-in-out infinite;
    }

    .bg .b {
      left: -24vmax;
      top: -10vmax;
      background: radial-gradient(circle, rgba(153, 51, 255, 0.55) 0%, rgba(153, 51, 255, 0) 70%);
      animation: drift 21s ease-in-out infinite reverse;
    }

    .bg .c {
      left: 10vmax;
      bottom: -28vmax;
      background: radial-gradient(circle, rgba(26, 230, 179, 0.5) 0%, rgba(26, 230, 179, 0) 68%);
      animation: drift 21s ease-in-out 7s infinite;
    }

    @keyframes drift {
      0%, 100% { transform: scale(1); opacity: 0.55; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }

    main {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .card {
      width: min(420px, 100%);
      padding: 36px 28px 28px;
      border-radius: 28px;
      background: var(--card);
      text-align: center;
      box-shadow: 0 16px 40px rgba(26, 26, 30, 0.06);
    }

    .icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      display: block;
      margin: 0 auto 20px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    p {
      margin: 10px 0 0;
      font-size: 16px;
      line-height: 1.45;
      color: var(--muted);
    }

    .stores {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      padding: 0 18px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .btn svg {
      width: 20px;
      height: 20px;
      flex: none;
    }

    .ios { background: var(--ink); }
    .android { background: var(--blue); }

    .btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="a"></span>
    <span class="b"></span>
    <span class="c"></span>
  </div>
  <main>
    <section class="card">
      <img class="icon" src="icon.png" alt="">
      <h1>Rada</h1>
      <p>Законопроєкти Верховної Ради та голосування.</p>
      <div class="stores">
        <a class="btn ios" id="ios-link" href="">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-.1 2.9-2.3c.7-1 1.2-2.1 1.5-3.2-3.9-1.5-3.8-5.5-3.8-5.2zM14.7 6.2c.6-.8 1.1-1.9.9-3-1 .1-2.1.6-2.8 1.4-.6.7-1.2 1.8-.1 3.5 1.1.1 2.1-.5 2-1.9z"/></svg>
          Завантажити для iOS
        </a>
        <a class="btn android" id="android-link" href="">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.2 8.2 5.4 5.1a.4.4 0 0 1 .7-.4l1.9 3.2a7.4 7.4 0 0 1 8 0l1.9-3.2a.4.4 0 1 1 .7.4l-1.8 3.1A6.8 6.8 0 0 1 19.6 13H4.4a6.8 6.8 0 0 1 2.8-4.8zM8 10.2a.7.7 0 1 0 0-1.4.7.7 0 0 0 0 1.4zm8 0a.7.7 0 1 0 0-1.4.7.7 0 0 0 0 1.4zM4.2 14h1.3v5.2a1 1 0 0 0 2 0V14h9v5.2a1 1 0 0 0 2 0V14h1.3a.8.8 0 0 0 0-1.6H4.2a.8.8 0 0 0 0 1.6z"/></svg>
          Завантажити для Android
        </a>
      </div>
    </section>
  </main>
</body>
</html>
